name: tests

on:
  push:
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: ledger CLI
        uses: ./.github/actions/pinned-ledger
      - name: promtool 3.16.0
        uses: ./.github/actions/pinned-promtool
      - name: user namespaces for the userns backend
        # Ubuntu's AppArmor refuses them to unconfined programs such as unshare.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: unit tests
        run: |
          python -m pip install jsonschema
          python -m unittest discover -s tests -v
      - name: completion and manpage generation pass one
        uses: stackhands/.github/.github/actions/parser-cli-assets@main
        with:
          pythonpath: .
          parser_ref: eb_staged_rebuild.cli._parser
          parser_module: eb_staged_rebuild.cli
          parser_function: _parser
          prog: eb-staged-rebuild
          out_completions_dir: ${{ runner.temp }}/esr-cli-one/completions
          out_man_dir: ${{ runner.temp }}/esr-cli-one/man
          out_bash_file: eb-staged-rebuild.bash
          out_zsh_file: _eb-staged-rebuild
          out_man_file: eb-staged-rebuild.1
      - name: completion and manpage generation pass two
        uses: stackhands/.github/.github/actions/parser-cli-assets@main
        with:
          pythonpath: .
          parser_ref: eb_staged_rebuild.cli._parser
          parser_module: eb_staged_rebuild.cli
          parser_function: _parser
          prog: eb-staged-rebuild
          out_completions_dir: ${{ runner.temp }}/esr-cli-two/completions
          out_man_dir: ${{ runner.temp }}/esr-cli-two/man
          out_bash_file: eb-staged-rebuild.bash
          out_zsh_file: _eb-staged-rebuild
          out_man_file: eb-staged-rebuild.1
      - name: completion and manpage generation is reproducible
        run: |
          cmp "${RUNNER_TEMP}/esr-cli-one/completions/eb-staged-rebuild.bash" "${RUNNER_TEMP}/esr-cli-two/completions/eb-staged-rebuild.bash"
          cmp "${RUNNER_TEMP}/esr-cli-one/completions/_eb-staged-rebuild" "${RUNNER_TEMP}/esr-cli-two/completions/_eb-staged-rebuild"
          cmp "${RUNNER_TEMP}/esr-cli-one/man/eb-staged-rebuild.1" "${RUNNER_TEMP}/esr-cli-two/man/eb-staged-rebuild.1"
          ls -1 "${RUNNER_TEMP}/esr-cli-one/completions" "${RUNNER_TEMP}/esr-cli-one/man"
      - name: every test that imports the Python code has a TESTMAP.md row
        run: python tests/check_testmap.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: ledger CLI
        uses: ./.github/actions/pinned-ledger
      - name: bubblewrap and Lmod
        run: sudo apt-get update && sudo apt-get install -y bubblewrap lmod openssl acl
      - name: user namespaces for the userns backend
        # Ubuntu's AppArmor refuses them to unconfined programs such as unshare.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: EasyBuild 5.4.2
        run: python -m pip install easybuild-framework==5.4.2 easybuild-easyblocks==5.4.2 easybuild-easyconfigs==5.4.2
      - name: rebuild stagedemo
        env:
          EB_STAGED_REBUILD_INTEGRATION: "1"
          LMOD_CMD: /usr/share/lmod/lmod/libexec/lmod
        run: |
          export PATH="/usr/share/lmod/lmod/libexec:${PATH}"
          python -m unittest tests.test_easybuild_integration -v
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: promtool 3.16.0
        uses: ./.github/actions/pinned-promtool
      - run: zig build -Drelease=true
      - name: generate completion and manpage assets
        uses: stackhands/.github/.github/actions/parser-cli-assets@main
        with:
          pythonpath: .
          parser_ref: eb_staged_rebuild.cli._parser
          parser_module: eb_staged_rebuild.cli
          parser_function: _parser
          prog: eb-staged-rebuild
          out_completions_dir: zig-out/share/completions
          out_man_dir: zig-out/share/man
          out_bash_file: eb-staged-rebuild.bash
          out_zsh_file: _eb-staged-rebuild
          out_man_file: eb-staged-rebuild.1
      - name: list generated cli assets
        run: |
          ls -1 zig-out/share/completions zig-out/share/man
          test -s zig-out/share/man/eb-staged-rebuild.1
      - name: rebuild stagedemo with the binary
        env:
          EB_STAGED_REBUILD_INTEGRATION: "1"
          LMOD_CMD: /usr/share/lmod/lmod/libexec/lmod
        run: |
          export PATH="/usr/share/lmod/lmod/libexec:${PATH}"
          TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest tests.test_easybuild_integration_cli -v

  docs:
    # The scripts behind the documented output; docs.yml builds the site.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: shellcheck -S warning docs/examples/*.sh
      - run: python -m pip install .
      - name: the tutorial
        run: bash docs/examples/tutorial.sh
      - name: ledger CLI
        uses: ./.github/actions/pinned-ledger
      - name: bubblewrap and Lmod
        run: sudo apt-get update && sudo apt-get install -y bubblewrap lmod openssl acl
      - name: EasyBuild 5.4.2
        run: python -m pip install easybuild-framework==5.4.2 easybuild-easyblocks==5.4.2 easybuild-easyconfigs==5.4.2
      - name: user namespaces for the userns backend
        # Ubuntu's AppArmor refuses them to unconfined programs such as unshare.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build -Drelease=true
      - name: the example site of the how-to guides, with the binary
        env:
          LMOD_CMD: /usr/share/lmod/lmod/libexec/lmod
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/site
          # The runner's /opt hands a default ACL on to /opt/site, and that ACL,
          # not EASYBUILD_UMASK, would set the modes of the verify case's tree.
          sudo setfacl -b /opt/site
          export PATH="$PWD/zig-out/bin:/usr/share/lmod/lmod/libexec:${PATH}"
          bash docs/examples/site.sh all

  zig:
    # The Zig build: its unit tests, and the read-only commands compared
    # with the Python tool.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # argparse's usage wrapping and choice quoting change between Python
      # releases; the binary prints what Python 3.14 prints.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # setup-zig checks the tarball's minisign signature against the Zig
      # project's key.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig fmt --check build.zig build.zig.zon zig
      - run: zig build test --summary all
      - run: zig build -Drelease=true
      - name: fuse3 for the filesystem fault tests
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
      - name: filesystem faults against the release binary
        run: EB_STAGED_REBUILD_REQUIRE_TESTS=1 TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest -v tests.test_prefix_punch_eio tests.test_sealed_dir_chmod tests.test_prefix_dir_fsync tests.test_retire_dir_fsync
      - name: the release binary carries no test hooks
        run: |
          ! grep -aq EB_STAGED_REBUILD_ACL_MODEL zig-out/bin/eb-staged-rebuild
          ! grep -aq EB_STAGED_REBUILD_FAIL_AT zig-out/bin/eb-staged-rebuild
          ! zig build -Dtest-ops -Drelease=true
      - name: the -Dtest-ops test artifact
        run: zig build -Dtest-ops
      - name: build.zig.zon's version and -Dcommit reach --version
        run: bash tests/build_version.sh
      - run: shellcheck -S warning tests/differential.sh tests/build_version.sh
      - name: parser error-shape parity against Python 3.14
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest -v tests.test_cli_parser_error_shape_parity
      - name: commands against the Python tool
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" bash tests/differential.sh
      - name: a run and a rollback killed at every step, then resumed
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python tests/crash_matrix.py
      - name: a run signalled while its build command runs
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python tests/signal_harness.py
      - name: ledger CLI
        uses: ./.github/actions/pinned-ledger
      - name: publication access metadata against the Python tool
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python tests/differential_metadata.py
      - name: verify and the publish gate, both implementations
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest -v tests.test_verify_cli
      - name: ACL publication tests against the test artifact
        run: TOOL_BIN_TEST_OPS="$PWD/zig-out/bin/eb-staged-rebuild-test-ops" python -m unittest -v tests.test_acl_publication_cli
      - name: a run and a rollback failed at every step, against the test artifact
        run: TOOL_BIN_TEST_OPS="$PWD/zig-out/bin/eb-staged-rebuild-test-ops" python tests/fail_matrix.py
      - name: ledger append, recovery and idempotence against eb-stack, both implementations
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest -v tests.test_ledger_eb_stack_cli
      - name: the bounded ledger call through run, both implementations
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest -v tests.test_ledger_bounded_cli
      - name: promtool 3.16.0
        uses: ./.github/actions/pinned-promtool
      - name: metrics output and atomic failures against both implementations
        run: TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" TOOL_BIN_TEST_OPS="$PWD/zig-out/bin/eb-staged-rebuild-test-ops" python -m unittest -v tests.test_metrics_cli
      - name: a user attribute the filesystem will not copy
        # Ubuntu's AppArmor refuses user namespaces to unconfined programs.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          EB_STAGED_REBUILD_REQUIRE_TESTS=1 TOOL_BIN="$PWD/zig-out/bin/eb-staged-rebuild" python -m unittest -v tests.test_prefix_user_xattr_parity
