[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "eb-staged-rebuild"
version = "2.0.1"
description = "Stage an EasyBuild rebuild and atomically exchange it with the live directory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rohit Goswami", email = "rgoswami@ieee.org"}]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dependencies = []

[project.scripts]
eb-staged-rebuild = "eb_staged_rebuild:main"

[tool.setuptools.packages.find]
include = ["eb_staged_rebuild*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
eb_staged_rebuild = ["bin/eb-staged-rebuild"]

[tool.cibuildwheel]
# One abi3 wheel from CPython 3.11 for every GIL CPython, and one wheel per
# free-threaded CPython, which takes no abi3 wheel.
build = ["cp311-manylinux_*", "cp313t-manylinux_*", "cp314t-manylinux_*"]
archs = ["native"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
test-command = "eb-staged-rebuild --version"

[tool.cibuildwheel.linux.environment]
# The release job builds the static binary first; the container sees the
# checkout as /project.
EB_STAGED_REBUILD_BINARY = "/project/out/bin/eb-staged-rebuild"
